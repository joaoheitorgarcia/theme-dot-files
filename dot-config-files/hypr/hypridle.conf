# ──────────────────────────────────────────────
# Hypridle configuration
# Handles screen dim, lock, and suspend behavior
# ──────────────────────────────────────────────

general {
    # Enable systemd inhibition during idle
    before_sleep_cmd = $HOME/.config/hypr/scripts/idle-guard.sh lock
    after_sleep_cmd = hyprctl dispatch dpms on
}

# ───────────────
# TIMEOUT STAGES
# ───────────────

# Dim screen after 5 minutes
listener {
    timeout = 300
    on-timeout = $HOME/.config/hypr/scripts/idle-guard.sh dim
    on-resume  = hyprshade off
}

# Lock after 10 minutes
listener {
    timeout = 600
    on-timeout = $HOME/.config/hypr/scripts/idle-guard.sh lock
}

# Turn screen off after 11 minutes
listener {
    timeout = 660
    on-timeout = $HOME/.config/hypr/scripts/idle-guard.sh dpms-off
    on-resume = hyprctl dispatch dpms on
}

