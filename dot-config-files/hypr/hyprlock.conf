source = ~/.config/hypr/colors.conf

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $image
    blur_passes = 2
    blur_size = 8
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    inner_color = rgba(151217cc)
    outer_color = rgba(968e98aa)
    check_color = rgba(ddb9f7ff)
    fail_color = rgba(ffb4abff)
    font_color = rgba(e8e0e8ff)
    fail_text = $PAMFAIL
    fade_on_empty = false
    placeholder_text = Password
    dots_spacing = 0.25
    rounding = 8

    position = 0, -95
    halign = center
    valign = center
}

#Clock
label {
    monitor =
    text = $TIME
    color = rgba(e8e0e8ff)
    font_size = 84

    position = 0, 80
    halign = center
    valign = center
}

#Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(cdc3ceff)
    font_size = 22

    position = 0, -10
    halign = center
    valign = center
}
