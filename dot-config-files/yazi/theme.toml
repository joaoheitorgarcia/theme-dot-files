# : Manager [[[

[mgr]
cwd = { fg = "#e2e3d8" }

# Tab
tab_active = { fg = "#1f3701", bg = "#b2d189", bold = true }
tab_inactive = { fg = "#102000", bg = "#cdeda3" }
tab_width = 1

# Find
find_keyword = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied = { fg = "#6dd5cb", bg = "#6dd5cb" }
marker_cut = { fg = "#bcece7", bg = "#bcece7" }
marker_marked = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#a0d0cb", bg = "#a0d0cb" }

# Count
count_copied = { fg = "#00201e", bg = "#bcece7" }
count_cut = { fg = "#00201e", bg = "#bcece7" }
count_selected = { fg = "#1f3701", bg = "#a0d0cb" }

# Border
border_symbol = " "
border_style  = { fg = "#b2d189" }

# : ]]]


# : Status [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#b2d189", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#b2d189", fg = "#1f3701", bold = true }
normal_alt  = { bg = "#44483d", fg = "#c5c8ba" }

# Select mode
select_main = { bg = "#c0cbad", fg = "#2a331e", bold = true }
select_alt  = { bg = "#44483d", fg = "#c5c8ba" }

# Unset mode
unset_main = { bg = "#a0d0cb", fg = "#003734", bold = true }
unset_alt  = { bg = "#44483d", fg = "#c5c8ba" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#b2d189", bg = "#383a32" }
progress_error = { fg = "#ffb4ab", bg = "#383a32" }

# Permissions
permissions_t = { fg = "#768857" }
permissions_w = { fg = "#479088" }
permissions_x = { fg = "#ff2b12" }
permissions_r = { fg = "#45cabc" }
permissions_s = { fg = "#87cf28" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#b2d189" }
active = { fg = "#a0d0cb", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#b2d189" }
value = { fg = "#e2e3d8" }

# : ]]]

# : Tabs [[[

[tabs]
active = { fg = "#b2d189", bold = true, bg = "#12140e" }
inactive = { fg = "#c0cbad", bg = "#12140e" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[completion]
border = { fg = "#1f3701", bg = "#b2d189" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#b2d189" }
title = {}
hovered = { fg = "#bcece7", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#383a32" }
cand = { fg = "#b2d189" }
rest = { fg = "#1f3701" }
desc = { fg = "#e2e3d8" }
separator = " ▶ "
separator_style = { fg = "#e2e3d8" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#e2e3d8" }
run = { fg = "#e2e3d8" }
footer = { fg = "#2a331e", bg = "#c0cbad" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#a0d0cb" }
title_warn = { fg = "#b2d189" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Fallback
    { mime = "*", fg = "#e2e3d8" },
    { mime = "inode/directory", fg = "#b2d189" },
]

# : ]]]
